name: Repack Windows base release

on:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Existing draft tag containing ZIP parts and checksum manifest
        required: true
        type: string

permissions:
  contents: write

jobs:
  repack:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CARGO_NET_OFFLINE: 'true'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DRAFT_TAG: ${{ inputs.draft_tag }}
    steps:
      - name: Download staged ZIP parts and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:DRAFT_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Destination must be an existing draft.' }
          $work = Join-Path $env:RUNNER_TEMP 'gangan-base'
          New-Item -ItemType Directory -Path $work | Out-Null
          gh release download $env:DRAFT_TAG --pattern '*.part-*' --pattern '*.parts.json' --dir $work
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download staged ZIP parts.' }
          "BASE_WORK=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Assemble and validate complete ZIP
        shell: python
        run: |
          import hashlib, json, os, zipfile
          from pathlib import Path
          work = Path(os.environ['BASE_WORK'])
          name = 'GanganMouse-V1.0-Windows-x64.zip'
          manifest = json.loads((work / (name + '.parts.json')).read_text('utf-8'))
          assert manifest['name'] == name
          output = work / name
          full = hashlib.sha256()
          with output.open('wb') as target:
              for part in manifest['parts']:
                  assert Path(part['name']).name == part['name'] and part['name'].startswith(name + '.part-')
                  source = work / part['name']
                  assert source.stat().st_size == part['size']
                  digest = hashlib.sha256()
                  with source.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          digest.update(chunk)
                          full.update(chunk)
                          target.write(chunk)
                  assert digest.hexdigest() == part['sha256']
          assert output.stat().st_size == manifest['size']
          assert full.hexdigest() == manifest['sha256']
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              for required in ['GanganMouse.exe', 'README.md', 'LICENSE', 'toolkit/python.exe', '.git/HEAD']:
                  assert 'GanganMouse/' + required in archive.namelist()
              assert archive.read('GanganMouse/runtime/gangan-core-revision').decode().strip() == manifest['commit']
          output.with_suffix('.zip.sha256').write_text(full.hexdigest() + '  ' + name + '\n', encoding='ascii')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('BASE_ZIP=' + str(output) + '\n')
          print('ZIP, part checksums, source revision and CRCs verified.')
      - name: Build offline using bundled Windows toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath $env:BASE_ZIP -DestinationPath (Join-Path $env:BASE_WORK 'verify')
          $base = Join-Path $env:BASE_WORK 'verify/GanganMouse'
          "BASE_ROOT=$base" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $script = '\\?\' + (Join-Path $base 'scripts/build.ps1')
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Release
          if ($LASTEXITCODE -ne 0) { throw 'Bundled offline build failed.' }
      - name: Verify packaged runtime startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OAS_DESKTOP_ROOT = $env:BASE_ROOT
          $check = Start-Process -FilePath (Join-Path $env:BASE_ROOT 'GanganMouse.exe') -ArgumentList '--check' -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Packaged program runtime check failed.' }
      - name: Upload validated ZIP and checksum to draft only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $draft = gh release view $env:DRAFT_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Destination is no longer a draft.' }
          gh release upload $env:DRAFT_TAG $env:BASE_ZIP "$env:BASE_ZIP.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed.' }
          Write-Output "Uploaded ZIP and checksum to draft $env:DRAFT_TAG. Publication is a separate step."
