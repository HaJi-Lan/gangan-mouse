[package]
name = "gangan-mouse"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "肝肝鼠：基于 OnmyojiAutoScript 二次开发的统一桌面"
repository = "https://github.com/HaJi-Lan/gangan-mouse"

[[bin]]
name = "GanganMouse"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
serde_json = { version = "1", features = ["preserve_order"] }
tract-onnx = "=0.21.15"
libloading = "=0.8.9"
rustfft = "=6.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

# Native image kernels are CPU-bound; keep dependencies compact while optimizing
# the application's numerical loops.
[profile.release.package.gangan-mouse]
opt-level = 3
